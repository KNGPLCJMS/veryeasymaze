    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Won!</title>
    <!--Loader is needed to prevent some audio issues-->
    <style>
      * { box-sizing: border-box; }
    
      body {
        margin: 0;
        height: 100vh;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
      }

      .loading {
        text-align: center;
      }
      #dialogue{
        color: #f5f5f5;
      }
      #spinner {
        width: 45px;
        height: 45px;
        margin: auto;
        border: 5px solid #ddd;
        border-top-color: #4285f4;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #prize {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      #face {
        width: 80vmin;
        height: 80vmin;
        animation: dance 0.06s infinite;
      }

      @keyframes dance {
        0%   { transform: translate(0,0) scale(1); }
        25%  { transform: translate(8px,-5px) scale(1.03); }
        50%  { transform: translate(-7px,6px) scale(.98); }
        75%  { transform: translate(5px,4px) scale(1.02); }
        100% { transform: translate(-4px,-3px) scale(1); }
      }
    </style>
    </head>

    <body>

    <div class="loading">
        <h1>You won</h1>
      <div id="spinner"></div>
      <p>Don't Click the Button</p>
      <button id="but" onclick="start()"> See Prize
      </button>
    </div>

    <div id="prize">
      <!-- Cake is drawn seperately from Bob-->
      <svg id="face" viewBox="0 0 500 500"
           xmlns="http://www.w3.org/2000/svg">

        <ellipse cx="250" cy="250" rx="190" ry="220"
                 fill="#eee"/>

        <ellipse cx="175" cy="205" rx="55" ry="75"
                 fill="#050505"/>
        <ellipse cx="325" cy="205" rx="55" ry="75"
                 fill="#050505"/>

        <ellipse cx="180" cy="215" rx="18" ry="30" fill="white"/>
        <ellipse cx="320" cy="215" rx="18" ry="30" fill="white"/>

        <path d="M125 315 Q250 455 375 315 Q350 410 250 425 Q150 410 125 315"
              fill="#050505"/>

        <path d="M150 335 L175 365 L195 340 L220 380 L245 342
                 L270 380 L295 340 L320 365 L350 335"
              fill="none"
              stroke="white"
              stroke-width="15"/>

        <circle cx="180" cy="215" r="7" fill="red"/>
        <circle cx="320" cy="215" r="7" fill="red"/>
      </svg>
      <img src="cake.png" alt="Cake" width="1">
    <audio id="sound" src="confettiCannon.mp3" preload="auto"></audio>
    </div>
    <div id="dialogue">
        <h1>Sorry About That</h1>
    </div>
    <script>
        document.getElementById("dialogue").style.display = "none"
        document.getElementById("spinner").style.display = "none"
      function start(){
        
        document.getElementById("but").style.display = "none"
        document.getElementById("spinner").style.display= "block"

        setTimeout(() => {
        document.getElementById("prize").style.display = "flex";
        document.getElementById("sound").play();
        
      }, 5000);
      setTimeout(() => {
        document.getElementById("dialogue").style.display = "block"
        document.getElementById("face").style.animation = "none";
      }, 6000);}

    </script>

    </body>
    </html>
